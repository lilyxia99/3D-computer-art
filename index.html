<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A curated list of 3D computer art slides">
    <title>3D Computer Art Slides</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        main {
            padding: 20px;
        }
        .slide-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            list-style-type: none;
            padding: 0;
        }
        .slide-item {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .slide-item:hover {
            transform: scale(1.03);
        }
        .slide-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .slide-item h3 {
            margin: 0;
            padding: 10px;
            background: #333;
            color: #fff;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: #fff;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>3D Computer Art Slides</h1>
        <p>The class slides by Leilei Xia.</p>
    </header>

    <main>
        <ul class="slide-list">
            <li class="slide-item">
                <a href="1.html"></a>
                <h3>Slide 1: Abstract Geometry</h3>
            </li>
            <li class="slide-item">
                <img src="slide2.jpg" alt="Slide 2">
                <h3>Slide 2: Futuristic Cityscape</h3>
            </li>
            <li class="slide-item">
                <img src="slide3.jpg" alt="Slide 3">
                <h3>Slide 3: Organic Sculptures</h3>
            </li>
            <!-- Add more slides here -->
        </ul>
    </main>

    <footer>
        <p>&copy; 2025 Leilei Xia. All rights reserved. | <a href="mailto:your-email@example.com">Contact Me</a></p>
    </footer>
</body>
</html>
